<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PINECAM DIGITAL CAMERA</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="camera-hardware-body">
      <!-- Top Hardware Controls -->
      <header class="app-header">
        <div class="brand-wrap">
          <span class="brand-tag">PINECAM</span>
          <span class="model-code">PRO CAMERA ENGINE</span>
        </div>
        <div class="top-actions">
          <button class="hud-btn active" id="lightLeakToggle">☀️ LEAKS</button>
          <button class="hud-btn active" id="grainToggle">🌾 GRAIN</button>
          <button class="hud-btn" id="flashToggle">⚡ OFF</button>
          <button class="hud-btn" id="timerToggle">⏱️ 0s</button>
        </div>
      </header>

      <!-- Glass LCD Viewfinder -->
      <main class="viewfinder-container">
        <canvas id="previewCanvas" class="preview-canvas"></canvas>

        <!-- Dazz HUD Overlay -->
        <div class="viewfinder-hud">
          <div class="hud-top">
            <div class="hud-pill-group">
              <span class="mode-badge" id="hudModeTag">PHOTO</span>
              <span class="status-tag" id="filterHudTag">CPM-35</span>
            </div>
            <span class="rec-dot hidden" id="recDot"
              >● REC <span id="recTimer">00:00</span></span
            >
            <span class="live-dot" id="liveDot">● ANALOG</span>
          </div>
          <div class="hud-bottom">
            <span class="timestamp-hud" id="hudTimestamp">'26 08 31</span>
            <span class="battery-hud">FILM [ |||| ]</span>
          </div>
        </div>

        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="toast-message" id="toast">Saved to Gallery</div>
        <div class="countdown-overlay hidden" id="countdownOverlay">3</div>
      </main>

      <!-- Hardware Lens Tweaks -->
      <div class="fx-adjustments-bar">
        <button class="adjust-chip active" id="vignetteToggle">
          Vignette: HEAVY
        </button>
        <button class="adjust-chip active" id="dateStampToggle">
          Date Stamp: ON
        </button>
        <button class="adjust-chip" id="flipCamBtn">Flip Lens 🔄</button>
      </div>

      <!-- Dazz Dial Presets -->
      <nav class="filter-dial-container">
        <div class="filter-track" id="filterTrack">
          <button class="filter-chip active" data-filter="cpm35">
            🎞️ CPM-35 (Warm)
          </button>
          <button class="filter-chip" data-filter="mono">
            🖤 Mono Noir (B&W)
          </button>
          <button class="filter-chip" data-filter="dclassic">
            📷 D Classic (CCD Green)
          </button>
          <button class="filter-chip" data-filter="classicFilm">
            📽️ Classic Film (90s)
          </button>
          <button class="filter-chip" data-filter="instantC">
            📸 Instant C (Polaroid)
          </button>

          <button class="filter-chip" data-filter="fx70">
            📼 FX-70 (Retro VHS)
          </button>
          <button class="filter-chip" data-filter="grd">
            🎬 GR D (Crunch B&W)
          </button>
          <button class="filter-chip" data-filter="fuji400">
            🌲 Fuji 400 (Teal)
          </button>
          <button class="filter-chip" data-filter="sunset">
            🌅 Sunset Gold
          </button>
        </div>
      </nav>

      <!-- Mode Selector & Tactical Shutter Panel -->
      <footer class="control-panel">
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="photo">STILL PHOTO</button>
          <button class="mode-btn" data-mode="video">HD VIDEO</button>
          <button class="mode-btn" data-mode="photobooth">
            PHOTOSTRIP (4X)
          </button>
        </div>

        <div class="shutter-row">
          <button
            class="aux-btn"
            id="downloadLatestBtn"
            title="Review Last Media"
          >
            <svg class="icon-svg" viewBox="0 0 24 24">
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
              />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
            </svg>
          </button>

          <button
            class="shutter-btn"
            id="shutterBtn"
            aria-label="Trigger Shutter"
          >
            <div class="shutter-inner" id="shutterInner"></div>
          </button>

          <div class="aux-placeholder"></div>
        </div>
      </footer>
    </div>

    <!-- Single Save Modal -->
    <div class="modal-overlay hidden" id="singleSaveModal">
      <div class="preview-card">
        <div class="modal-header">
          <h3>Analog Capture Preview</h3>
          <button class="close-btn" id="closeSaveModal">✕</button>
        </div>
        <div class="modal-preview-body">
          <img id="singlePreviewImg" src="" alt="Capture Preview" />
        </div>
        <div class="modal-footer">
          <button class="modal-btn secondary" id="discardSingleBtn">
            Discard
          </button>
          <button class="modal-btn primary" id="confirmSaveSingleBtn">
            Save Image
          </button>
        </div>
      </div>
    </div>

    <!-- Photobooth Studio Modal -->
    <div class="modal-overlay hidden" id="photoboothModal">
      <div class="photobooth-card">
        <div class="modal-header">
          <h3>Photostrip Studio</h3>
          <button class="close-btn" id="closePhotobooth">✕</button>
        </div>
        <div class="photobooth-body">
          <div class="strip-preview-area">
            <canvas id="stripCanvas"></canvas>
          </div>
          <div class="photobooth-controls">
            <div class="control-group">
              <label>Border Finish</label>
              <div class="color-picker-row" id="frameColorRow">
                <button
                  class="color-dot active"
                  data-color="#ffffff"
                  style="background: #ffffff"
                ></button>
                <button
                  class="color-dot"
                  data-color="#f7d6e0"
                  style="background: #f7d6e0"
                ></button>
                <button
                  class="color-dot"
                  data-color="#1e1e24"
                  style="background: #1e1e24"
                ></button>
                <button
                  class="color-dot"
                  data-color="#e6a15c"
                  style="background: #e6a15c"
                ></button>
              </div>
            </div>
            <div class="photobooth-actions">
              <button class="modal-btn primary" id="downloadStripBtn">
                Export Strip
              </button>
              <button class="modal-btn secondary" id="retakeStripBtn">
                Retake All
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <video
      id="hiddenVideo"
      playsinline
      autoplay
      muted
      class="hidden-input"
    ></video>
    <script src="script.js"></script>
  </body>
</html>
